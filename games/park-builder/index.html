<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>こうえんを つくろう</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=swap">
<meta name="theme-color" content="#cfe8b0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfe8b0; font-family: "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", "BIZ UDPGothic", sans-serif; }
  img { -webkit-user-drag: none; pointer-events: none; }

  #stage { position: fixed; inset: 0; background: center / cover no-repeat; touch-action: none; }

  /* 左の遊具だな：たてにスクロール */
  #tray { position: fixed; left: 0; top: 0; bottom: 0; width: clamp(120px, 20vw, 200px); padding: 14px 12px;
    background: rgba(255, 249, 235, .88); border-right: 4px solid #e2c99a; border-radius: 0 28px 28px 0;
    overflow-y: auto; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 14px; z-index: 50; transition: transform .5s; }
  .card { flex: none; aspect-ratio: 1; min-height: 0; position: relative; border-radius: 22px; background: #fff; border: 3px solid #f0dfbd;
    display: grid; place-items: center; padding: 10px; touch-action: pan-y; box-shadow: 0 4px 0 #ead6ae; }
  .card img { position: absolute; inset: 0; width: 100%; height: 100%; padding: inherit; object-fit: contain; }
  .card:active { transform: scale(.95); }
  /* 横向きは高さが足りないので、半分の大きさで2列にならべる */
  @media (orientation: landscape) {
    #tray { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: start; overflow-x: hidden; gap: 10px; padding: 12px 10px; }
    .card { border-radius: 16px; padding: 6px; border-width: 2px; box-shadow: 0 3px 0 #ead6ae; }
  }

  /* 公園に置いた遊具。left/top は足もとの位置 */
  .item { position: absolute; transform: translate(-50%, -100%); touch-action: none; }
  .item img { width: 100%; display: block; filter: drop-shadow(0 6px 4px rgba(40, 70, 20, .25)); transform: scaleX(var(--flip, 1)); transition: transform .25s; }
  /* 色・柄をぬった所。もとの絵の上にかさねる */
  .item canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; transform: scaleX(var(--flip, 1)); transition: transform .25s; }
  .item.lift canvas { transform: scaleX(var(--flip, 1)) scale(1.06); }
  .item.pop { animation: pop .35s cubic-bezier(.3, 1.6, .5, 1); }
  .item.lift img { filter: drop-shadow(0 18px 10px rgba(40, 70, 20, .3)); transform: scaleX(var(--flip, 1)) scale(1.06); }
  .item.bye { animation: bye .3s ease-in forwards; }
  @keyframes pop { 0% { transform: translate(-50%, -100%) scale(.3); } 100% { transform: translate(-50%, -100%) scale(1); } }
  @keyframes bye { to { transform: translate(-50%, -100%) scale(0) rotate(30deg); opacity: 0; } }

  #ghost { position: fixed; z-index: 100; pointer-events: none; transform: translate(-50%, -85%) scale(1.05); opacity: .9; }
  #ghost img { width: 100%; filter: drop-shadow(0 16px 10px rgba(0, 0, 0, .25)); }

  /* 柄えらび */
  #palette { position: absolute; display: none; grid-template-columns: repeat(6, 46px); gap: 10px; padding: 12px 14px; border-radius: 30px;
    background: rgba(255, 255, 255, .95); box-shadow: 0 6px 16px rgba(0, 0, 0, .18); z-index: 60; transform: translate(-50%, 0); }
  #palette.show { display: grid; }
  #palette button { width: 46px; height: 46px; border-radius: 50%; border: 4px solid #fff; box-shadow: 0 0 0 2px #ddd; cursor: pointer; }
  #palette button.on { box-shadow: 0 0 0 4px #ffb84d; }
  #palette button.flip { background: #fff7e6; display: grid; place-items: center; padding: 0; }
  #palette button.flip svg { width: 30px; }

  /* ごみばこ：遊具を持っているときだけ出る */
  #trash { position: fixed; right: 20px; bottom: 20px; width: 92px; height: 92px; border-radius: 50%;
    background: #fff; box-shadow: 0 6px 14px rgba(0, 0, 0, .2); display: grid; place-items: center; z-index: 55;
    transform: scale(0); transition: transform .2s; }
  #trash.show { transform: scale(1); }
  #trash.hot { transform: scale(1.25); background: #ffe1dc; }
  #trash svg { width: 58px; }

  /* 看板（表紙・名前づけ・かんせいで つかう）。文字は板の上にのせる */
  .sign { position: relative; aspect-ratio: 300 / 240; container-type: inline-size; }
  .sign svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sign .board { position: absolute; left: 7.3%; top: 9.2%; width: 85.3%; height: 41.7%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; line-height: 1.15; color: #fff3d6; font-weight: 800; white-space: nowrap; text-shadow: 0 2px 0 #5e3a1a; }
  .sign.park { aspect-ratio: 300 / 200; }
  .sign.park .board { left: 7.3%; top: 10%; width: 85.3%; height: 40%; color: #1f5e2e; text-shadow: none; font-weight: 900; }

  /* 表紙 */
  #title { position: fixed; inset: 0; z-index: 150; background: url(images/bg_forest.webp) center / cover; overflow: hidden; transition: opacity .5s; }
  #title.hide { opacity: 0; pointer-events: none; }
  #title .sign { position: absolute; left: 50%; top: 3vh; width: min(46vw, 72vh); transform: translateX(-50%); }
  #title img { position: absolute; filter: drop-shadow(0 6px 4px rgba(40, 70, 20, .25)); }
  #title .slide { left: 3%; bottom: 4%; height: min(44vh, 26vw); }
  #title .spring { right: calc(50% + min(12vh, 8vw) + 2vw); bottom: 3%; height: min(20vh, 13vw); }
  #title .flower { left: calc(50% + min(12vh, 8vw) + 2vw); bottom: 2%; height: min(14vh, 8vw); }
  #title .swing { right: 3%; bottom: 6%; height: min(40vh, 26vw); }
  #start { position: absolute; left: 50%; bottom: 5vh; width: min(24vh, 16vw); aspect-ratio: 1; margin-left: calc(min(24vh, 16vw) / -2);
    border: 0; border-radius: 50%; background: #ff9f43; box-shadow: 0 8px 0 #d9762a, 0 12px 20px rgba(0, 0, 0, .2); cursor: pointer;
    display: grid; place-items: center; animation: hop 1.4s ease-in-out infinite; }
  #start svg { width: 52%; margin-left: 8%; }
  #start:active { transform: translateY(6px); box-shadow: 0 2px 0 #d9762a; animation: none; }
  @keyframes hop { 50% { transform: translateY(-8px); } }

  /* 右上のボタン：もどす・さいしょから・かんせい */
  #tools { position: fixed; top: 12px; right: 14px; z-index: 70; display: flex; gap: 12px; align-items: flex-start; transition: transform .4s; }
  .tool { border: 0; padding: 0; background: none; cursor: pointer; display: grid; justify-items: center; gap: 2px;
    font-family: inherit; font-weight: 800; font-size: 13px; color: #4f6b34; text-shadow: 0 0 4px #fff, 0 0 4px #fff; }
  .tool i { width: 60px; height: 60px; border-radius: 50%; background: #fff; box-shadow: 0 4px 0 #d8d0bf, 0 6px 10px rgba(0, 0, 0, .15); display: grid; place-items: center; }
  .tool svg { width: 36px; }
  .tool:active i { transform: translateY(3px); box-shadow: 0 1px 0 #d8d0bf; }
  .tool:disabled { opacity: .4; }
  #done { height: 60px; padding: 0 22px 0 14px; border-radius: 30px; background: #ff9f43; color: #fff; text-shadow: none;
    font-size: 24px; display: flex; align-items: center; gap: 6px; box-shadow: 0 5px 0 #d9762a, 0 8px 12px rgba(0, 0, 0, .15); }
  #done svg { width: 38px; }
  #done:active { transform: translateY(4px); box-shadow: 0 1px 0 #d9762a; }
  #edit { position: fixed; top: 12px; right: 14px; z-index: 70; transform: translateY(-150%); transition: transform .4s; }

  /* かんせい：たなとボタンをかくして、看板を立てる */
  #parkSign { position: absolute; left: 2vw; bottom: 1vh; width: min(30vw, 50vh); z-index: 5000; display: none; cursor: pointer; transform-origin: 50% 100%; }
  body.done #parkSign { display: block; animation: rise .6s cubic-bezier(.3, 1.6, .5, 1); }
  body.done #tray { transform: translateX(-110%); }
  body.done #tools { transform: translateY(-150%); }
  body.done #edit { transform: none; }
  body.done .item { pointer-events: none; }
  @keyframes rise { from { transform: scale(.2); } to { transform: scale(1); } }

  /* 名前づけ */
  #namer { position: fixed; inset: 0; z-index: 120; background: rgba(60, 90, 40, .55); display: none; flex-direction: column; align-items: center; padding-top: 3vh; gap: 2vh; }
  #namer.show { display: flex; }
  #namer .sign { width: min(56vw, 75vh); }
  #namer input { width: 96%; border: 0; border-bottom: 3px dashed #9cc4a5; caret-color: #1f5e2e; background: transparent; text-align: center; color: inherit;
    font-family: inherit; font-weight: 800; outline: none; padding: 0; user-select: text; -webkit-user-select: text; }
  #namer input::placeholder { color: #a9c9b0; }
  #namer .row { display: flex; gap: 18px; }
  #namer button { border: 0; border-radius: 32px; height: 64px; padding: 0 28px; font-family: inherit; font-weight: 800; font-size: 24px; cursor: pointer; }
  #ok { background: #5fbf5a; color: #fff; box-shadow: 0 5px 0 #3f8f3c; display: flex; align-items: center; gap: 6px; }
  #ok svg { width: 32px; }
  #cancel { background: #fff; color: #888; box-shadow: 0 5px 0 #ccc; }

  /* 遊ぶ子ども：かんせいのときだけ遊具の上に出る。場所は遊具の絵に対する割合（cqw は遊具のはば） */
  .kids { position: absolute; inset: 0; container-type: inline-size; pointer-events: none; transform: scaleX(var(--flip, 1)); display: none; }
  body.done .kids { display: block; animation: come .6s; }
  .kid { position: absolute; width: 0; height: 0; }
  .item .kid img { position: absolute; left: 0; top: 0; max-width: none; transform: translate(var(--ax), var(--ay)); filter: none; transition: none; }
  @keyframes come { from { opacity: 0; } }
  /* すべり台：上でまって、手をあげてすべりおりる */
  .kid.slide { animation: slideDown 3.6s linear infinite; }
  .kid.slide img:nth-child(1) { animation: frameA 3.6s step-end infinite; }
  .kid.slide img:nth-child(2) { animation: frameB 3.6s step-end infinite; }
  @keyframes slideDown {
    0% { left: 47%; top: 47%; opacity: 0; } 6% { opacity: 1; } 40% { left: 47%; top: 47%; animation-timing-function: ease-in; }
    58% { left: 71%; top: 70%; } 70% { left: 82%; top: 87%; } 78% { left: 91%; top: 93%; }
    92% { left: 91%; top: 93%; opacity: 1; } 100% { left: 91%; top: 93%; opacity: 0; } }
  @keyframes frameA { 0% { opacity: 1; } 40% { opacity: 0; } }
  @keyframes frameB { 0% { opacity: 0; } 40% { opacity: 1; } }
  /* ブランコ：足をぶらぶら ⇔ 足を前にけり出す。上の棒を中心に少しゆれる */
  .kid.swing { left: 39%; top: 70%; transform-origin: 0 -54cqw; animation: swingKid 2.4s ease-in-out infinite; }
  .kid.swing img:nth-child(1) { animation: frameA2 2.4s step-end infinite; }
  .kid.swing img:nth-child(2) { animation: frameB2 2.4s step-end infinite; }
  @keyframes swingKid { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  @keyframes frameA2 { 0% { opacity: 1; } 25% { opacity: 0; } 75% { opacity: 1; } }
  @keyframes frameB2 { 0% { opacity: 0; } 25% { opacity: 1; } 75% { opacity: 0; } }

  /* お祝いの紙ふぶき */
  .confetti { position: fixed; top: -20px; width: 12px; height: 18px; z-index: 110; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--r)); } }

  /* たて向きのときは「よこにしてね」の画面でおおう */
  #turn { position: fixed; inset: 0; z-index: 200; background: #cfe8b0; display: none; place-items: center; align-content: center; gap: 24px; }
  #turn svg { width: 46vw; max-width: 260px; }
  #turn .phone { transform-origin: 60px 60px; animation: turn 2.4s ease-in-out infinite; }
  #turn p { margin: 0; font-size: clamp(26px, 7vw, 40px); font-weight: bold; color: #4f8a6a; letter-spacing: .1em; }
  @keyframes turn { 0%, 25% { transform: rotate(0); } 55%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) { #turn { display: grid; } }
</style>
</head>

  <path d="M8 32l2-8 6 6z" fill="#f8deb2" stroke="#c9935a" stroke-width="3" stroke-linejoin="round"/></svg></i>なおす</button>

      <path d="M36 200q4-14 9-2q4-12 8 0q5-10 8 2zM230 200q4-14 9-2q4-12 8 0q5-10 8 2z" fill="#6fae4c"/>
      <g fill="#6d7a72" stroke="#4a544e" stroke-width="2"><rect x="46" y="96" width="12" height="104" rx="3"/><rect x="242" y="96" width="12" height="104" rx="3"/></g>
      <path d="M49 100v96M245 100v96" stroke="#9aa69f" stroke-width="2"/>

    <button id="cancel">やめる</button>
    <button id="ok"><svg viewBox="0 0 40 40"><path d="M8 21l8 8L33 11" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>できた</button>
  </div>
</div>

<script>
// 遊具のリスト。h は「いちばん手前に置いたときの高さ（画面の高さに対する割合）」
const ITEMS = [
  { id: 'slide', h: 0.42 },
  { id: 'swing', h: 0.36 },
  { id: 'seesaw', h: 0.17 },
  { id: 'jungle_gym', h: 0.46 },
  { id: 'sandbox', h: 0.22 },
  { id: 'spring_rider', h: 0.15 },
  { id: 'flowerbed', h: 0.14 },
  { id: 'water_tap', h: 0.2 },
  { id: 'bench', h: 0.15 },
];
// 遊ぶ子どもの絵。w は絵のはば、k は遊具の絵とくらべた大きさ、a は足もと（こし）の位置
const KIDS = {
  slide: { nat: 800, k: 0.34, frames: [{ id: 'kid_slide_1', w: 627, a: [37, 100] }, { id: 'kid_slide_2', w: 667, a: [36, 100] }] },
  swing: { nat: 589, k: 0.36, frames: [{ id: 'kid_swing_1', w: 320, a: [50, 72] }, { id: 'kid_swing_2', w: 439, a: [38, 70] }] },
};
const HORIZON = 0.50; // これより上（空や森）には置けない
const FRONT = 0.97;   // いちばん手前

const stage = document.getElementById('stage');
const tray = document.getElementById('tray');
const palette = document.getElementById('palette');
const trash = document.getElementById('trash');
stage.style.backgroundImage = 'url(images/bg_forest.webp)';

// ===== 音（ポン！） =====
let ac;
function pon(freq = 520) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = 'sine';
    o.frequency.setValueAtTime(freq, t);
    o.frequency.exponentialRampToValueAtTime(freq * 2.2, t + 0.08);
    g.gain.setValueAtTime(0.35, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t + 0.26);
  } catch (e) {}
}

// ===== 大きさ：奥ほど小さく =====
function sizeAt(item, y) {
  const H = innerHeight;
  const depth = Math.max(0, Math.min(1, (y / H - HORIZON) / (FRONT - HORIZON)));
  return item.h * H * 1.2 * (0.45 + 0.55 * depth); // 高さ(px)。1.2 は全体を一回り大きくする分
}
function widthFor(item, img, y) {
  const r = img.naturalWidth / img.naturalHeight || 1;
  return sizeAt(item, y) * r;
}
const clampY = y => Math.max(innerHeight * (HORIZON + 0.06), Math.min(innerHeight * FRONT, y));
const trayRight = () => tray.getBoundingClientRect().right;
const clampX = x => Math.max(trayRight() + 40, Math.min(innerWidth - 40, x));

// ===== 遊具だな =====
ITEMS.forEach(item => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<img src="images/${item.id}.webp" alt="">`;
  tray.appendChild(card);
  card.addEventListener('pointerdown', e => startFromTray(e, item, card));
});

let ghost = null;
function startFromTray(e, item, card) {
  const sx = e.clientX, sy = e.clientY;
  let dragging = false;
  const move = ev => {
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    // 横（公園のほう）に引っぱったら持ち上げる。たてに動かしたときはスクロール
    if (!dragging && (dx > 12 && dx > Math.abs(dy) || ev.pointerType === 'mouse' && Math.hypot(dx, dy) > 8)) {
      dragging = true;
      card.releasePointerCapture?.(ev.pointerId);
      ghost = document.createElement('div');
      ghost.id = 'ghost';
      ghost.innerHTML = `<img src="images/${item.id}.webp" alt="">`;
      document.body.appendChild(ghost);
      hidePalette();
    }
    if (dragging) {
      const img = ghost.firstChild;
      ghost.style.width = widthFor(item, img, clampY(ev.clientY)) + 'px';
      ghost.style.left = ev.clientX + 'px';
      ghost.style.top = ev.clientY + 'px';
    }
  };
  const up = ev => {
    removeEventListener('pointermove', move);
    removeEventListener('pointerup', up);
    removeEventListener('pointercancel', up);
    if (!dragging) return;
    ghost.remove(); ghost = null;
    if (ev.type === 'pointerup' && ev.clientX > trayRight()) place(item, clampX(ev.clientX), clampY(ev.clientY));
  };
  addEventListener('pointermove', move);
  addEventListener('pointerup', up);
  addEventListener('pointercancel', up);
}

// ===== 公園に置く =====
function place(item, x, y) {
  save();
  const el = makeItem(item, x, y);
  el.classList.add('pop');
  el.addEventListener('animationend', () => el.classList.remove('pop'), { once: true });
  pon();
}
function makeItem(item, x, y, pattern = 0, flip = false) {
  const el = document.createElement('div');
  el.className = 'item';
  el.innerHTML = `<img src="images/${item.id}.webp" alt="">`;
  el.data = { item, x, y, pattern, flip };
  if (flip) el.style.setProperty('--flip', -1);
  stage.appendChild(el);
  layout(el);
  if (pattern) applyPattern(el, pattern).catch(() => {});
  const kid = KIDS[item.id];
  if (kid) {
    const kids = document.createElement('div');
    kids.className = 'kids';
    kids.innerHTML = `<div class="kid ${item.id}">` + kid.frames.map(f =>
      `<img src="images/${f.id}.webp" alt="" style="width:${f.w * kid.k / kid.nat * 100}cqw;--ax:-${f.a[0]}%;--ay:-${f.a[1]}%">`).join('') + '</div>';
    el.appendChild(kids);
  }
  el.addEventListener('pointerdown', e => grab(e, el));
  return el;
}
function layout(el) {
  const d = el.data, img = el.firstChild;
  const set = () => {
    el.style.left = d.x + 'px';
    el.style.top = d.y + 'px';
    el.style.width = widthFor(d.item, img, d.y) + 'px';
    el.style.zIndex = Math.round(d.y); // 手前のものが上
  };
  img.complete ? set() : img.addEventListener('load', set, { once: true });
}

// ===== 置いた遊具を動かす・さわる =====
function grab(e, el) {
  e.preventDefault();
  const d = el.data;
  const sx = e.clientX, sy = e.clientY, ox = d.x - sx, oy = d.y - sy;
  let moved = false;
  el.setPointerCapture(e.pointerId);
  const move = ev => {
    if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 8) return;
    if (!moved) { moved = true; save(); el.classList.add('lift'); trash.classList.add('show'); hidePalette(); }
    d.x = clampX(ev.clientX + ox);
    d.y = clampY(ev.clientY + oy);
    layout(el);
    trash.classList.toggle('hot', overTrash(ev));
  };
  const up = ev => {
    el.removeEventListener('pointermove', move);
    el.removeEventListener('pointerup', up);
    el.removeEventListener('pointercancel', up);
    el.classList.remove('lift');
    trash.classList.remove('show', 'hot');
    if (!moved) { showPalette(el); return; }
    if (overTrash(ev)) { el.classList.add('bye'); el.addEventListener('animationend', () => el.remove()); pon(260); }
  };
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
}
function overTrash(ev) {
  const r = trash.getBoundingClientRect();
  return Math.hypot(ev.clientX - (r.left + r.width / 2), ev.clientY - (r.top + r.height / 2)) < r.width * 0.9;
}

// ===== 柄えらび =====
// 赤くぬった所だけに色や柄をのせる（灰色の柱やくさりは そのまま）。上の段は無地、下の段は柄。0 は もとの赤
let seed = 1;
const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
function starPath(c, x, y, r) {
  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
    c.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  c.fill();
}
function heartPath(c, x, y, r) {
  c.beginPath();
  c.moveTo(x, y + r * 0.9);
  c.bezierCurveTo(x - r * 1.3, y, x - r * 0.8, y - r, x, y - r * 0.35);
  c.bezierCurveTo(x + r * 0.8, y - r, x + r * 1.3, y, x, y + r * 0.9);
  c.fill();
}
function blob(c, x, y, r) {
  c.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = rnd() * 6.3, d = r * 0.5 * rnd();
    c.moveTo(x + Math.cos(a) * d, y + Math.sin(a) * d);
    c.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, r * (0.5 + 0.4 * rnd()), 0, 7);
  }
  c.fill();
}
// s は柄ひとつ分の大きさ
const grid = (w, h, s, fn) => {
  for (let y = 0, row = 0; y < h + s; y += s, row++)
    for (let x = (row % 2) * s / 2; x < w + s; x += s) fn(x, y);
};
const PATTERNS = [
  { bg: '#e5483d' },
  { bg: '#f5c531' },
  { bg: '#5fbf5a' },
  { bg: '#3d8fe0' },
  { bg: '#f07fb8' },
  { bg: '#3b6fd1', draw: (c, w, h, s) => { c.fillStyle = '#ffd84a'; grid(w, h, s, (x, y) => starPath(c, x, y, s * 0.3)); } },
  { bg: '#f27aa8', draw: (c, w, h, s) => { c.fillStyle = '#fff'; grid(w, h, s * 0.8, (x, y) => { c.beginPath(); c.arc(x, y, s * 0.17, 0, 7); c.fill(); }); } },
  { bg: '#fff0f4', draw: (c, w, h, s) => { c.fillStyle = '#ff5f8f'; grid(w, h, s, (x, y) => heartPath(c, x, y, s * 0.28)); } },
  { bg: '#fbfaf5', draw: (c, w, h, s) => { c.fillStyle = '#2b2b2b'; grid(w, h, s * 1.6, (x, y) => blob(c, x + s * (rnd() - .5), y + s * (rnd() - .5), s * 0.45)); } },
  { bg: '#7d8f4e', draw: (c, w, h, s) => {
    ['#a58a5a', '#4f6b34', '#2f3b25'].forEach(col => { c.fillStyle = col; grid(w, h, s * 1.1, (x, y) => blob(c, x + s * (rnd() - .5), y + s * (rnd() - .5), s * 0.35)); });
  } },
];
function paintPattern(k, w, h, s) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const c = cv.getContext('2d'), p = PATTERNS[k];
  c.fillStyle = p.bg; c.fillRect(0, 0, w, h);
  seed = 7; // 毎回おなじ模様になるように
  p.draw?.(c, w, h, s);
  return cv;
}
// 赤い所だけのかげの絵（_paint.webp）に柄をかけて、もとの絵の上にかさねる
const paints = {};
function paintImg(id) {
  return paints[id] = paints[id] || new Promise((ok, ng) => {
    const img = new Image();
    img.onload = () => ok(img);
    img.onerror = ng;
    img.src = `images/${id}_paint.webp`;
  });
}
async function applyPattern(el, k) {
  el.querySelector('canvas')?.remove();
  if (!k) return;
  const pm = await paintImg(el.data.item.id);
  if (el.data.pattern !== k) return; // 待つあいだに別の柄が押された
  const w = pm.naturalWidth, h = pm.naturalHeight, cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const c = cv.getContext('2d');
  c.drawImage(paintPattern(k, w, h, Math.max(w, h) / 7), 0, 0);
  c.globalCompositeOperation = 'multiply';    // 絵の明るい・暗いをうつす
  c.drawImage(pm, 0, 0);
  c.globalCompositeOperation = 'destination-in'; // 赤い所だけのこす
  c.drawImage(pm, 0, 0);
  el.querySelector('canvas')?.remove();
  el.insertBefore(cv, el.querySelector('.kids'));
}
PATTERNS.forEach((pt, i) => {
  const b = document.createElement('button');
  b.dataset.k = i;
  if (pt.draw) {
    b.style.background = `url(${paintPattern(i, 60, 60, 26).toDataURL()}) center / cover`;
  } else b.style.background = pt.bg;
  b.addEventListener('pointerdown', async e => {
    e.stopPropagation();
    if (!paletteFor) return;
    const el = paletteFor;
    if (el.data.pattern === i) return;
    save();
    el.data.pattern = i;
    markPalette(i);
    pon(700 + i * 60);
    try { await applyPattern(el, i); } catch (err) { return; }
    el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  });
  palette.appendChild(b);
});
// 左右の向きをかえるボタン
const flipBtn = document.createElement('button');
flipBtn.className = 'flip';
flipBtn.innerHTML = '<svg viewBox="0 0 40 40"><path d="M20 6v28" stroke="#c9a46a" stroke-width="3" stroke-dasharray="4 4"/>'
  + '<path d="M15 12L4 20l11 8z" fill="#f08a5d"/><path d="M25 12l11 8-11 8z" fill="#5da8f0"/></svg>';
flipBtn.addEventListener('pointerdown', e => {
  e.stopPropagation();
  if (!paletteFor) return;
  save();
  paletteFor.data.flip = !paletteFor.data.flip;
  paletteFor.style.setProperty('--flip', paletteFor.data.flip ? -1 : 1);
  pon(600);
});
palette.insertBefore(flipBtn, palette.children[5]); // 無地の段の右はし
const markPalette = k => [...palette.children].forEach(x => x.classList.toggle('on', x.dataset.k == k));
function showPalette(el) {
  paletteFor = el;
  const r = el.getBoundingClientRect();
  palette.style.left = Math.max(trayRight() + 150, Math.min(innerWidth - 150, r.left + r.width / 2)) + 'px';
  palette.style.top = Math.min(innerHeight - 140, r.bottom + 10) + 'px';
  markPalette(el.data.pattern);
  palette.classList.add('show');
}
function hidePalette() { palette.classList.remove('show'); paletteFor = null; }
stage.addEventListener('pointerdown', e => { if (e.target === stage) hidePalette(); });

// 画面の大きさがかわったら、置いた場所も同じ割合でうごかす（地面から浮かないように）
let lastW = innerWidth, lastH = innerHeight;
addEventListener('resize', () => {
  const kx = innerWidth / lastW, ky = innerHeight / lastH;
  lastW = innerWidth; lastH = innerHeight;
  document.querySelectorAll('.item').forEach(el => { el.data.x *= kx; el.data.y *= ky; layout(el); });
  hidePalette();
});
// ===== もどす・さいしょから =====
// 何かかえる前に、公園のようすを とっておく（場所は画面に対する割合で）
const undoStack = [];
const undoBtn = document.getElementById('undo');
const placed = () => [...stage.querySelectorAll('.item:not(.bye)')];
function save() {
  undoStack.push(placed().map(({ data: d }) => ({ item: d.item, fx: d.x / innerWidth, fy: d.y / innerHeight, pattern: d.pattern, flip: d.flip })));
  if (undoStack.length > 50) undoStack.shift();
  undoBtn.disabled = false;
}
undoBtn.addEventListener('click', () => {
  if (!undoStack.length) return;
  hidePalette();
  stage.querySelectorAll('.item').forEach(el => el.remove());
  undoStack.pop().forEach(o => makeItem(o.item, o.fx * innerWidth, o.fy * innerHeight, o.pattern, o.flip));
  undoBtn.disabled = !undoStack.length;
  pon(440);
});
document.getElementById('reset').addEventListener('click', () => {
  const all = placed();
  if (!all.length) return;
  save(); // 「もどす」で元にもどせる
  hidePalette();
  all.forEach(el => { el.classList.add('bye'); el.addEventListener('animationend', () => el.remove(), { once: true }); });
  pon(260);
});

// ===== かんせい！と看板 =====
let parkName = '';
const namer = document.getElementById('namer');
const nameInput = document.getElementById('nameInput');
const parkSign = document.getElementById('parkSign');
// 字の数が多いほど小さく（cqw は看板のはばに対する割合）
const fitSize = (text, max) => Math.min(max, 76 / Math.max(1, [...text].length)) + 'cqw';
function signLines() {
  const n = parkName || 'みんなの';
  if (/(こうえん|公園)$/.test(n)) return [n];
  return [...n].length <= 6 ? [n + 'こうえん'] : [n, 'こうえん'];
}
function fitInput() {
  nameInput.style.fontSize = fitSize(nameInput.value || 'なまえ', 12);
  nameInput.nextElementSibling.style.fontSize = '10cqw';
}
function openNamer() {
  hidePalette();
  nameInput.value = parkName;
  fitInput();
  namer.classList.add('show');
  nameInput.focus();
}
nameInput.addEventListener('input', fitInput);
nameInput.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) finish(); });
document.getElementById('done').addEventListener('click', openNamer);
document.getElementById('cancel').addEventListener('click', () => { nameInput.blur(); namer.classList.remove('show'); });
document.getElementById('ok').addEventListener('click', finish);
parkSign.addEventListener('click', openNamer);
document.getElementById('edit').addEventListener('click', () => { document.body.classList.remove('done'); pon(600); });

function finish() {
  parkName = nameInput.value.trim();
  nameInput.blur();
  namer.classList.remove('show');
  const lines = signLines();
  parkSign.querySelector('.board').replaceChildren(...lines.map((t, i) => {
    const sp = document.createElement('span');
    sp.textContent = t;
    sp.style.fontSize = fitSize(t, lines.length > 1 ? (i ? 10 : 12) : 14);
    return sp;
  }));
  document.body.classList.remove('done');
  void parkSign.offsetWidth; // 看板が毎回ぴょんと出るように
  document.body.classList.add('done');
  confetti();
  fanfare();
}
function confetti() {
  const colors = ['#ff6b6b', '#ffd84a', '#5fbf5a', '#3d8fe0', '#f07fb8', '#ff9f43'];
  for (let i = 0; i < 70; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.borderRadius = i % 3 ? '3px' : '50%';
    c.style.setProperty('--dx', (Math.random() - .5) * 200 + 'px');
    c.style.setProperty('--r', (Math.random() - .5) * 1440 + 'deg');
    c.style.animationDuration = 2.2 + Math.random() * 2 + 's';
    c.style.animationDelay = Math.random() * .8 + 's';
    document.body.appendChild(c);
    c.addEventListener('animationend', () => c.remove());
  }
}
// ド・ミ・ソ・ド〜
function fanfare() {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    [[523, 0], [659, .15], [784, .3], [1047, .45], [784, .7], [1047, .85]].forEach(([f, d], i, a) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + d;
      o.type = 'triangle';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.3, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + (i === a.length - 1 ? .8 : .3));
      o.connect(g).connect(ac.destination);
      o.start(t); o.stop(t + .9);
    });
  } catch (e) {}
}

// ===== 表紙 =====
document.getElementById('start').addEventListener('click', () => {
  document.getElementById('title').classList.add('hide');
  pon(700);
});

// ホーム画面から開いたときなどは、横向きに固定できる
addEventListener('pointerdown', () => screen.orientation?.lock?.('landscape').catch(() => {}), { once: true });
</script>
