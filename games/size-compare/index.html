<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>大きさくらべ</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="大きさくらべ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top:#0b1220; --bg-mid:#1a2638; --horizon:#3a4a5e;
    --ink:#eef1f5; --sub:#9aa6b6; --faint:#5d6a7c; --accent:#e6b25c;
    --glass:rgba(255,255,255,.06); --line:rgba(255,255,255,.14);
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; }
  body {
    background:var(--bg-top); color:var(--ink);
    font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif; font-weight:400;
    user-select:none; -webkit-user-select:none;
  }
  .num { font-family:"Inter","Noto Sans JP",sans-serif; font-feature-settings:"tnum"; }
  canvas { position:fixed; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  button { font-family:inherit; color:var(--ink); cursor:pointer; }
  .glass {
    background:var(--glass); border:1px solid var(--line); border-radius:999px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }

  /* 大人／子ども 切りかえ */
  .modeSwitch { display:inline-flex; padding:3px; gap:2px; }
  .modeSwitch button {
    border:none; background:transparent; color:var(--sub); font-size:12px; letter-spacing:.08em;
    padding:6px 12px; border-radius:999px;
  }
  .modeSwitch button.on { background:rgba(255,255,255,.14); color:var(--ink); }

  /* はじめの画面 */
  #start {
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(120% 70% at 50% 100%, #3a4a5e 0%, #1a2638 45%, #0b1220 100%);
    padding:24px 16px; text-align:center;
  }
  #start .top { position:absolute; top:calc(14px + env(safe-area-inset-top)); left:16px; right:16px; display:flex; justify-content:space-between; align-items:center; }
  .back { color:var(--sub); font-size:13px; text-decoration:none; letter-spacing:.05em; }
  .eyebrow { font-family:"Inter",sans-serif; font-size:12px; letter-spacing:.42em; color:var(--accent); margin-bottom:14px; }
  #start h1 { font-size:32px; font-weight:300; letter-spacing:.12em; margin-bottom:14px; }
  #start p { font-size:14px; color:var(--sub); line-height:1.9; margin-bottom:44px; }
  .inputRow { display:flex; align-items:center; gap:18px; margin-bottom:44px; }
  .inputRow .step { width:44px; height:44px; font-size:20px; font-weight:300; }
  .field { display:flex; align-items:baseline; gap:6px; border-bottom:1px solid var(--line); padding:0 6px 6px; }
  #heightInput {
    width:140px; background:transparent; border:none; outline:none; color:var(--ink);
    font-family:"Inter",sans-serif; font-weight:300; font-size:64px; text-align:center;
    -moz-appearance:textfield;
  }
  #heightInput::-webkit-outer-spin-button, #heightInput::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .unit { font-family:"Inter",sans-serif; font-size:18px; color:var(--sub); }
  #goBtn {
    font-size:15px; letter-spacing:.2em; padding:14px 46px;
    border:1px solid var(--accent); color:var(--accent); background:transparent; border-radius:999px;
    transition:background .2s, color .2s;
  }
  #goBtn:active, #goBtn:hover { background:var(--accent); color:#111; }
  #err { color:#e28b7a; font-size:13px; height:20px; margin-top:16px; }

  /* くらべる画面 */
  #topbar { position:fixed; top:calc(12px + env(safe-area-inset-top)); left:16px; right:16px; z-index:6; display:flex; justify-content:space-between; align-items:center; }
  #againBtn { font-size:12px; letter-spacing:.06em; padding:7px 14px; color:var(--sub); }
  #panel { position:fixed; top:calc(58px + env(safe-area-inset-top)); left:0; right:0; z-index:5; pointer-events:none; padding:0 20px; }
  #pEn { font-family:"Inter",sans-serif; font-size:11px; letter-spacing:.32em; color:var(--accent); min-height:14px; }
  #pName { font-size:24px; font-weight:500; letter-spacing:.04em; margin-top:4px; line-height:1.3; }
  #pSize { margin-top:8px; display:flex; align-items:baseline; gap:10px; }
  #pDim { font-size:12px; color:var(--sub); letter-spacing:.1em; }
  #pVal { font-family:"Inter",sans-serif; font-weight:300; font-size:40px; line-height:1; font-feature-settings:"tnum"; }
  #pUnit { font-family:"Inter",sans-serif; font-size:16px; color:var(--sub); }
  #pRatio { margin-top:8px; font-size:13px; color:var(--ink); }
  #pRatio b { font-family:"Inter",sans-serif; font-weight:600; color:var(--accent); font-size:15px; }
  #pMemo { margin-top:6px; font-size:12px; color:var(--sub); line-height:1.7; max-width:420px; }

  #controls {
    position:fixed; left:0; right:0; bottom:calc(22px + env(safe-area-inset-bottom)); z-index:5;
    display:flex; justify-content:center; align-items:center; gap:14px; padding:0 16px;
  }
  .arrow { width:52px; height:52px; display:flex; align-items:center; justify-content:center; }
  .arrow svg { width:18px; height:18px; stroke:var(--ink); fill:none; stroke-width:1.5; }
  #meBtn { height:44px; padding:0 20px; font-size:13px; letter-spacing:.08em; }
  .hidden { display:none !important; }
</style>
</head>
<body>

<canvas id="cv"></canvas>

<div id="topbar" class="hidden">
  <button id="againBtn" class="glass" data-t="change"></button>
  <div class="modeSwitch glass"><button data-mode="adult">大人</button><button data-mode="kid">こども</button></div>
</div>

<div id="panel" class="hidden">
  <div id="pEn"></div>
  <div id="pName"></div>
  <div id="pSize"><span id="pDim"></span><span id="pVal"></span><span id="pUnit"></span></div>
  <div id="pRatio"></div>
  <div id="pMemo"></div>
</div>

<div id="controls" class="hidden">
  <button class="arrow glass" id="leftBtn" aria-label="smaller"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button id="meBtn" class="glass" data-t="me"></button>
  <button class="arrow glass" id="rightBtn" aria-label="larger"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
</div>

<div id="start">
  <div class="top">
    <a class="back" href="../index.html" data-t="back"></a>
    <div class="modeSwitch glass"><button data-mode="adult">大人</button><button data-mode="kid">こども</button></div>
  </div>
  <div class="eyebrow">SIZE COMPARISON</div>
  <h1 data-t="title"></h1>
  <p data-t="lead"></p>
  <div class="inputRow">
    <button id="minus" class="step glass">−</button>
    <div class="field">
      <input id="heightInput" type="number" inputmode="numeric" value="170" min="30" max="250">
      <span class="unit">cm</span>
    </div>
    <button id="plus" class="step glass">+</button>
  </div>
  <button id="goBtn" data-t="go"></button>
  <div id="err"></div>
</div>

const R = (x, y, w, h) => `M${x} ${y}h${w}v${h}h${-w}Z`;

const DK = 'rgba(0,0,0,.22)';

    'M20.5 55L29 55L29 97Q29 100 27 100L23 100Q20.5 100 20.5 98Z',

}

    s.push(`M${25 - rw / 2} ${y - 8}Q${25 - rw / 2 + 3} ${y - 10} ${25 - rw / 2 + 7} ${y - 12.5}L${25 + rw / 2 - 7} ${y - 12.5}Q${25 + rw / 2 - 3} ${y - 10} ${25 + rw / 2} ${y - 8}Z`);
  }
  s.push(R(24.2, 4, 1.6, 40));
  for (let i = 0; i < 6; i++) s.push(E(25, 12 + i * 3.2, 2.6, 0.9));
  s.push(E(25, 3, 1.4));
  return s;

const IMG_KEYS = ['hamster','cat','rabbit','shiba','penguin','adult','vending','bear','elephant','freed','giraffe',
  'trex','nara_daibutsu','torii','whale','shinkansen','himeji','toji','jumbo','ushiku','harukas','tokyotower','skytree','fuji','mirai','skybus','ferris','h3'];

const kidLook = {};
const imagesReady = Promise.all([...ITEMS, USER].map(it => new Promise(done => {
  const im = new Image();
  im.onload = () => { it.image = im; it.vb = [im.naturalWidth, im.naturalHeight]; done(); };
  im.onerror = () => done();

// ===== 状態 =====
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
let list = [];         // ならんだアイテム
let userIdx = 0;
let t = 0, target = 0; // いま見ている位置（アイテム番号、小数あり）
let dragging = false, lastX = 0, lastTime = 0, vel = 0;
let running = false;

const pathCache = new Map();
const getPath = d => { let p = pathCache.get(d); if (!p) { p = new Path2D(d); pathCache.set(d, p); } return p; };

function build(heightM) {
  USER.size = heightM;
  // 150cm 以上なら 自分を大人の写真にし、同じ写真の「成人男性」は外す
  const grown = heightM >= 1.5, adult = ITEMS.find(it => it.img === 'adult');
  if (kidLook.image && adult.image) Object.assign(USER, grown ? { image: adult.image, vb: adult.vb } : kidLook);
  list = [...ITEMS.filter(it => !(grown && it === adult)), USER].sort((a, b) => a.size - b.size);
  // 小さい順に、いまの集まりの右・左へ交互に置いていく（少し重ねて、大きいものは後ろ）
  let L = 0, R = 0;
  list.forEach((it, i) => {
    const [vw, vh] = it.vb;
    if (it.real) { [it.w, it.h] = it.real; } // 長さも高さも本物どおり
    else if (it.dim === 'h') { it.h = it.size; it.w = it.size * vw / vh; }
    else { it.w = it.size; it.h = it.size * vh / vw; }
    if (i === 0) { it.x = it.w / 2; it.side = 1; L = 0; R = it.w; }
    else {
      it.side = i % 2 ? 1 : -1;
      const ov = Math.min(it.w * 0.45, (R - L) * 0.55);
      it.x = it.side > 0 ? R + it.w / 2 - ov : L - it.w / 2 + ov;
      L = Math.min(L, it.x - it.w / 2); R = Math.max(R, it.x + it.w / 2);
    }
    it.L = L; it.R = R; // ここまでの集まりのはば
  });
  userIdx = list.indexOf(USER);
  drawOrder = [...list].sort((a, b) => b.h - a.h); // 大きいものから描く＝後ろ
}
let drawOrder = [];

const groundY = () => H * 0.80;

// アイテム i が出たときのカメラ：i までの集まりが入って、i がいちばん大きく見える
function frame(i) {
  const it = list[i];
  const usable = groundY() - H * 0.38;
  const s = Math.min(usable * 0.92 / it.h, W * (it.fitW || 0.92) / (it.R - it.L));
  const cx = (it.R - it.L) * s > W ? it.x : (it.L + it.R) / 2;
  return { cx, s };
}

function camera(tt) {
  const i = Math.max(0, Math.min(list.length - 2, Math.floor(tt)));
  let f = Math.max(0, Math.min(1, tt - i));
  if (tt >= list.length - 1) f = 1;
  const a = frame(i), b = frame(i + 1);
  const sf = f * f * (3 - 2 * f); // なめらかに
  const s = Math.exp(Math.log(a.s) * (1 - sf) + Math.log(b.s) * sf);
  // 中心は「画面上で」なめらかに動くよう、倍率で重みをつける
  const cx = (a.cx * a.s * (1 - sf) + b.cx * b.s * sf) / (a.s * (1 - sf) + b.s * sf);
  return { cx, s };
}

// 出てくるときの ぽんっ という大きさ
const easeOutBack = v => { const c = 1.7; return 1 + (c + 1) * Math.pow(v - 1, 3) + c * Math.pow(v - 1, 2); };

// ===== 描画 =====
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / p;
  return (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10) * p;
}
function fmtLen(m) {
  if (m < 1) return `${+(m * 100).toFixed(0)}cm`;
  if (m < 10) return `${+m.toFixed(2)}m`;
  if (m < 100) return `${+m.toFixed(1)}m`;
  return `${Math.round(m).toLocaleString()}m`;
}

const nameOf = it => MODE === 'kid' ? it.kname : it.name;

function drawItem(it, left, top, pw, ph) {
  if (it.image) { ctx.drawImage(it.image, left, top, pw, ph); return; }
  const [vw, vh] = it.vb;
  ctx.translate(left, top);
  ctx.scale(pw / vw, ph / vh);
  for (const sh of it.shapes) {
    if (typeof sh === 'string') { ctx.fillStyle = it.color; ctx.fill(getPath(sh)); }
    else { ctx.fillStyle = sh[0]; ctx.fill(getPath(sh[1])); }
  }
}

function draw() {
  const { cx, s } = camera(t);
  const gy = groundY();
  const toX = x => (x - cx) * s + W / 2;

  // 空
  const sky = ctx.createLinearGradient(0, 0, 0, gy);
  sky.addColorStop(0, '#0b1220'); sky.addColorStop(0.55, '#1a2638'); sky.addColorStop(1, '#3a4a5e');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, gy);
  const glow = ctx.createLinearGradient(0, gy - H * 0.18, 0, gy);
  glow.addColorStop(0, 'rgba(230,178,92,0)'); glow.addColorStop(1, 'rgba(230,178,92,.10)');
  ctx.fillStyle = glow; ctx.fillRect(0, gy - H * 0.18, W, H * 0.18);

  // 目もり
  const step = niceStep((gy - H * 0.3) / 3 / s);
  ctx.font = '400 10px Inter, sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
  for (let k = 1; ; k++) {
    const y = Math.round(gy - k * step * s) + 0.5;
    if (y < 0) break;
    ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.32)'; ctx.fillText(fmtLen(k * step), W - 10, y - 3);
  }

  // 床
  const floor = ctx.createLinearGradient(0, gy, 0, H);
  floor.addColorStop(0, '#171d26'); floor.addColorStop(1, '#090c11');
  ctx.fillStyle = floor; ctx.fillRect(0, gy, W, H - gy);

  // 出ているものと大きさを先に計算
  const shown = [];
  drawOrder.forEach(it => {
    const i = list.indexOf(it);
    const vis = Math.max(0, Math.min(1, (t - i + 1) / 0.6));
    if (vis <= 0) return;
    const k = 0.4 + 0.6 * easeOutBack(vis);
    const pw = it.w * s * k, ph = it.h * s * k;
    const mid = toX(it.x), left = mid - pw / 2;
    if (left > W || left + pw < 0) return;
    if (ph < 0.6 && !it.isUser) return;
    shown.push({ it, i, vis, pw, ph, mid, left });
  });

  // 床への うつりこみ
  ctx.save();
  ctx.beginPath(); ctx.rect(0, gy, W, H - gy); ctx.clip();
  for (const d of shown) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, d.vis * 1.5) * 0.16;
    ctx.translate(0, 2 * gy); ctx.scale(1, -1);
    drawItem(d.it, d.left, gy - d.ph, d.pw, d.ph);
    ctx.restore();
  }
  ctx.restore();
  const fade = ctx.createLinearGradient(0, gy, 0, gy + Math.max(60, (H - gy) * 0.7));
  fade.addColorStop(0, 'rgba(14,18,24,0)'); fade.addColorStop(1, 'rgba(10,13,18,1)');
  ctx.fillStyle = fade; ctx.fillRect(0, gy, W, H - gy);
  ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.fillRect(0, gy, W, 1);

  // かげ と 本体
  const focus = Math.round(t);
  const labels = [];
  for (const d of shown) {
    const { it, i, vis, pw, ph, mid, left } = d;
    ctx.save();
    ctx.globalAlpha = Math.min(1, vis * 1.5);
    const sw = pw * 0.55, sh = Math.max(1.5, Math.min(pw * 0.05, 14));
    const shadow = ctx.createRadialGradient(mid, gy, 0, mid, gy, sw);
    shadow.addColorStop(0, 'rgba(0,0,0,.55)'); shadow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = shadow;
    ctx.save(); ctx.translate(mid, gy); ctx.scale(1, sh / sw); ctx.translate(-mid, -gy);
    ctx.beginPath(); ctx.arc(mid, gy, sw, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    drawItem(it, left, gy - ph, pw, ph);
    ctx.restore();

    if (it.isUser) {
      ctx.fillStyle = '#e6b25c';
      ctx.fillRect(mid - Math.max(6, pw * 0.4), gy + 3, Math.max(12, pw * 0.8), 2);
      // ちいさくて見えないときは 上に しるし
      if (ph < 14 && mid > -20 && mid < W + 20) {
        ctx.strokeStyle = '#e6b25c'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(mid - 6, gy - ph - 16); ctx.lineTo(mid, gy - ph - 8); ctx.lineTo(mid + 6, gy - ph - 16); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(mid, gy - ph - 8); ctx.lineTo(mid, gy - ph - 30); ctx.stroke();
      }
    }
    if (ph > 26 || i === focus || it.isUser) labels.push({ it, i, mid });
  }

  // なまえ（見ているもの → 自分 → 大きいもの の順に、重ならないところへ）
  labels.sort((a, b) => (b.i === focus) - (a.i === focus) || b.it.isUser - a.it.isUser || b.it.h - a.it.h);
  const placed = [];
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0.06em';
  for (const lb of labels) {
    const big = lb.i === focus;
    ctx.font = `${big ? 500 : 400} ${big ? 13 : 11}px "Noto Sans JP", sans-serif`;
    const text = nameOf(lb.it);
    const tw = ctx.measureText(text).width + 10;
    const x0 = Math.max(tw / 2 + 4, Math.min(W - tw / 2 - 4, lb.mid));
    for (const row of [0, 1, 2]) {
      const y = gy + 12 + row * 18;
      if (placed.some(p => p.row === row && Math.abs(p.x - x0) < (p.tw + tw) / 2)) continue;
      placed.push({ x: x0, tw, row });
      ctx.fillStyle = lb.it.isUser ? '#e6b25c' : big ? '#eef1f5' : 'rgba(238,241,245,.5)';
      ctx.fillText(text, x0, y);
      break;
    }
  }
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';

  // 見ているものの 高さの線
  const f = list[focus];
  if (f && f.dim === 'h') {
    const ph = f.h * s, mid = toX(f.x), pw = f.w * s;
    if (ph > 30) {
      const lx = Math.round(f.side > 0 ? Math.min(W - 12, mid + pw / 2 + 10) : Math.max(12, mid - pw / 2 - 10)) + 0.5;
      ctx.strokeStyle = 'rgba(230,178,92,.85)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(lx, gy); ctx.lineTo(lx, gy - ph);
      ctx.moveTo(lx - 4, gy - ph); ctx.lineTo(lx + 4, gy - ph);
      ctx.moveTo(lx - 4, gy); ctx.lineTo(lx + 4, gy); ctx.stroke();
    }
  }
}

};
let MODE = 'adult';
try { MODE = localStorage.getItem('sizeCompareMode') === 'kid' ? 'kid' : 'adult'; } catch (e) {}

function setMode(m) {
  MODE = m;
  try { localStorage.setItem('sizeCompareMode', m); } catch (e) {}
  const u = UI[MODE];
  document.querySelectorAll('[data-t]').forEach(el => el.innerHTML = u[el.dataset.t]);
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === MODE));
  shownIdx = -1;
  if (running) updatePanel();
}
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));

function splitLen(m) {
  if (m < 1) return [String(Math.round(m * 100)), 'cm'];
  if (m < 100) return [String(+m.toFixed(2)), 'm'];
  return [Math.round(m).toLocaleString(), 'm'];
}
function ratioHTML(it) {
  const u = UI[MODE];
  const r = it.size / USER.size;
  if (r > 0.95 && r < 1.05) return u.same;
  if (r >= 1) return u.times(r < 10 ? +r.toFixed(1) : Math.round(r).toLocaleString());
  return u.frac(Math.round(1 / r));
}
let shownIdx = -1;
function updatePanel() {
  const i = Math.round(t);
  if (i === shownIdx) return;
  shownIdx = i;
  const it = list[i], u = UI[MODE];
  const [val, unit] = splitLen(it.size);
  document.getElementById('pEn').textContent = it.en;
  document.getElementById('pName').textContent = nameOf(it);
  document.getElementById('pDim').textContent = it.isUser ? u.you : it.dim === 'h' ? u.h : u.w;
  document.getElementById('pVal').textContent = val;
  document.getElementById('pUnit').textContent = unit;
  document.getElementById('pRatio').innerHTML = it.isUser ? '' : ratioHTML(it);
  document.getElementById('pMemo').textContent = it.isUser ? u.youMemo : MODE === 'kid' ? it.kmemo : it.memo;
}

// ===== うごき =====
const clampT = v => Math.max(0, Math.min(list.length - 1, v));
function loop() {
  if (!running) return;
  if (!dragging) {
    vel *= 0.92;
    if (Math.abs(vel) > 0.002) { t = clampT(t + vel); target = Math.round(t); }
    else { vel = 0; t += (target - t) * 0.12; if (Math.abs(target - t) < 0.0005) t = target; }
  }
  draw();
  updatePanel();
  requestAnimationFrame(loop);
}

const dragUnit = () => Math.max(160, W * 0.55); // 1つ分すすむのに必要な px

cv.addEventListener('pointerdown', e => {
  if (!running) return;
  dragging = true; lastX = e.clientX; lastTime = performance.now(); vel = 0;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!dragging) return;
  const now = performance.now();
  const dt = -(e.clientX - lastX) / dragUnit();
  t = clampT(t + dt);
  const ms = Math.max(1, now - lastTime);
  vel = vel * 0.6 + (dt / ms * 16) * 0.4;
  lastX = e.clientX; lastTime = now;
});
const endDrag = () => {
  if (!dragging) return;
  dragging = false;
  if (performance.now() - lastTime > 80) vel = 0;
  vel = Math.max(-0.35, Math.min(0.35, vel));
  target = Math.round(clampT(t + vel * 8));
  if (Math.abs(vel) < 0.02) vel = 0;
};
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);
cv.addEventListener('wheel', e => {
  if (!running) return;
  e.preventDefault(); vel = 0;
  t = clampT(t + (e.deltaY + e.deltaX) / 500);
  target = Math.round(t);
}, { passive:false });

const go = d => { vel = 0; target = clampT(Math.round(target) + d); };
document.getElementById('leftBtn').onclick = () => go(-1);
document.getElementById('rightBtn').onclick = () => go(1);
document.getElementById('meBtn').onclick = () => { vel = 0; target = userIdx; };
addEventListener('keydown', e => {
  if (!running) return;
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
});

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (running) draw();
}
addEventListener('resize', resize);
resize();

// ===== はじめの画面 =====
const input = document.getElementById('heightInput');
const err = document.getElementById('err');
const GAME_IDS = ['panel', 'controls', 'topbar'];
const bump = d => { input.value = Math.max(30, Math.min(250, (parseInt(input.value) || 170) + d)); };
document.getElementById('minus').onclick = () => bump(-1);
document.getElementById('plus').onclick = () => bump(1);
document.getElementById('goBtn').onclick = async () => {
  const cm = parseFloat(input.value);
  if (!(cm >= 30 && cm <= 250)) { err.textContent = UI[MODE].err; return; }
  err.textContent = UI[MODE].loading;
  input.blur();
  await imagesReady;
  err.textContent = '';
  build(cm / 100);
  t = target = userIdx; vel = 0; shownIdx = -1;
  document.getElementById('start').classList.add('hidden');
  GAME_IDS.forEach(id => document.getElementById(id).classList.remove('hidden'));
  running = true;
  requestAnimationFrame(loop);
};
document.getElementById('againBtn').onclick = () => {
  running = false;
  document.getElementById('start').classList.remove('hidden');
  GAME_IDS.forEach(id => document.getElementById(id).classList.add('hidden'));
};
setMode(MODE);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
</script>
